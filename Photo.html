    <header>
        <h1>PHOTO</h1>

    <div class="my-button-container">   
            <a href="index.html"><button class="my-button">Home</button></a> 
    </div>

    <div class="formClear"></div>

    <section class="justified-grid-gallery">
        <figure style="--width: 640; --height: 520; ">
            <img src="assets/example.jpg" alt="Landscape scene of a clearing in the forest, overlooked by powerlines descending in the scene and a bright blue sky with fluffed white clouds." />
        </figure>
        <figure style="--width: 640; --height: 520; ">
            <img src="assets/buttonscan.png" alt="Close up of a pile of buttons and small trinket items, varied in color, size, and shape." />
        </figure>
        <figure style="--width: 710; --height: 880; ">
            <img src="assets/spectator.png" alt="Ominous greyscale scene of backlit figures/objects behind a frosted textured screen." />
        </figure>
        <figure style="--width: 760; --height: 940; ">
            <img src="assets/questionyarn.png" alt="Small ball of red yarn, with loose yarn arranged in a looped, question-mark shape, contrasted by a black background with a gradient grey field in the bottom." />
        </figure>
        <figure style="--width: 690; --height: 470; ">
            <img src="assets/woodance.png" alt="Two arranged figures, in motion side by side, contrasted with a black background." />
        </figure>
        <figure style="--width: 540; --height: 740; ">
            <img src="assets/ahandonit.png" alt="Greyscale scene of an ambiguous, disarranged figure backlit and behind a frosted textured screen." />
        </figure>
        <figure style="--width: 640; --height: 520; ">
            <img src="assets/Slide Photos.jpg" alt="Ambiguous scene of neon lit shapes, layered in arrangement and color. Prominently featuring rectangular shapes and shades of bright turquoise, orange, yellow, and black." />
        </figure>
        <figure style="--width: 640; --height: 520; ">
            <img src="assets/Slide Photos-11.jpg" alt="Lone person sitting on train tracks, surrounded by crowds of a vibrant green forest." />
        </figure>
        <figure style="--width: 640; --height: 520; ">
            <img src="assets/Slide Photos-10.jpg" alt="Copper orange bridge peaking through the frame of vibrant green and yellow trees." />
        </figure>
        <figure style="--width: 540; --height: 740; ">
            <img src="" alt="" />
        </figure>
        <figure style="--width: 340; --height: 550; ">
            <img src="" alt="" />
        </figure>
